[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxvm-py"
version = "0.1.0"
description = "Python bindings for the ctxvm Rust engine (replay, profile, diff, export). Thin subprocess wrapper around the committed rust CLI binaries until a PyO3 binding lands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "the ctxvm authors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
ctxvm-py = "ctxvm_py.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctxvm_py*"]
