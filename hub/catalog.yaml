schema: https://opendataproducts.org/odpc-v1.0/schema/odpc.yaml
version: '1.0'
kind: Catalog
catalog:
  metadata:
    id: hub.ctxvm.dev
    name:
      en: ctxvm hub
    description:
      en: 'Open hub catalog for the ctxvm project: xCABI trace corpus, conformance
        vectors, benchmarks.'
  productReferences:
  - id: ctxvm-corpus-0.1
    productID: ctxvm-corpus-0.1
    productVersion: 0.8.0
    name:
      en: ctxvm Trace Corpus
    description:
      en: "A curated, checksummed, versioned collection of deterministic agent-session\
        \ traces (pages, renders, evictions, faults) plus benchmark suites and golden\
        \ conformance vectors. Replays byte-identically per the xCABI invariants.\
        \ Drops: corpus/m1 (seed \u2014 three reference/adapter-derived traces plus\
        \ two tracer-generated sessions), corpus/m2 (first live harness captures \u2014\
        \ echo and sustained-pressure sessions from a real OpenCode loop on a free-tier\
        \ model), corpus/m3 (first Hermes plugin traces \u2014 synthetic echo and\
        \ sustained-pressure sessions generated by the Python tracer port), and corpus/m4\
        \ (first LIVE Hermes plugin capture \u2014 13 pages, one tool_recall fault\
        \ and one errored call from a real gateway-backed session at plugin version\
        \ 0.2.0, paths redacted), and corpus/m5 (first interactive self-capture \u2014\
        \ a long-running OpenCode TUI agent recording its own working turns: 17 pages,\
        \ 17 one-turn-late cold-entry faults, 14 turns, zero evictions, flush witnessed\
        \ at graceful TUI exit), and corpus/m6 (first pause/resume pair \u2014 a real\
        \ OpenCode agent run paused mid-session by the UC1 turn-shaped handoff trigger\
        \ at turn 3: the packaged snapshot via the committed export binary plus the\
        \ session booted with CTXVM_RESUME_FROM and the resumeFrom sidecar evidence;\
        \ 9 pages across both sessions, zero evictions, pause byte-identical to the\
        \ era-as-flushed), and corpus/m7 (first hermes-side typed pause/resume pair\
        \ \u2014 a real interactive hermes TUI session typed /ctxvm-handoff mid-session\
        \ at turn 3 through the systemd gateway service, and a genuinely fresh session\
        \ booted with CTXVM_RESUME_FROM: package-verified boot before any hook work,\
        \ then package-carried reconstruction; 45 pages across both sessions, zero\
        \ evictions, zero faults, shipped turn-3 package digest-pinned to the boot-verified\
        \ set), and corpus/m8 (first Vercel AI SDK adapter drop \u2014 scripted echo\
        \ and sustained re-read sessions driven through the ai 7.0.154 streamText\
        \ plugin pair with @ai-sdk/openai-compatible on NVIDIA NIM's free tier at\
        \ USD 0: a 10-turn echo walking read \u2192 re-read (tool_recall) \u2192 edit\
        \ \u2192 fresh read \u2192 a genuinely thrown tool error (no page), and a\
        \ 6-turn 3-round re-read thrash; middleware render count equals tap step count\
        \ on both traces, counts witness green)."
    productModel:
      standard: ODPS
      version: '4.1'
      format: yaml
      $ref: ../04-odps-dataproduct-corpus.yaml
    visibility: public
    status: draft
    type: dataset
