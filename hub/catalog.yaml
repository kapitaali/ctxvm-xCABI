schema: https://opendataproducts.org/odpc-v1.0/schema/odpc.yaml
version: '1.0'
kind: Catalog
catalog:
  metadata:
    id: hub.ctxvm.dev
    name:
      en: ctxvm hub
    description:
      en: 'Open hub catalog for the ctxvm project: xCABI trace corpus, conformance
        vectors, benchmarks.'
  productReferences:
  - id: ctxvm-corpus-0.1
    productID: ctxvm-corpus-0.1
    productVersion: 0.4.0
    name:
      en: ctxvm Trace Corpus
    description:
      en: "A curated, checksummed, versioned collection of deterministic agent-session\
        \ traces (pages, renders, evictions, faults) plus benchmark suites and golden\
        \ conformance vectors. Replays byte-identically per the xCABI invariants.\
        \ Drops: corpus/m1 (seed \u2014 three reference/adapter-derived traces plus\
        \ two tracer-generated sessions), corpus/m2 (first live harness captures \u2014\
        \ echo and sustained-pressure sessions from a real OpenCode loop on a free-tier\
        \ model), corpus/m3 (first Hermes plugin traces \u2014 synthetic echo and\
        \ sustained-pressure sessions generated by the Python tracer port), and corpus/m4\
        \ (first LIVE Hermes plugin capture \u2014 13 pages, one tool_recall fault\
        \ and one errored call from a real gateway-backed session at plugin version\
        \ 0.2.0, paths redacted)."
    productModel:
      standard: ODPS
      version: '4.1'
      format: yaml
      $ref: ../04-odps-dataproduct-corpus.yaml
    visibility: public
    status: draft
    type: dataset
