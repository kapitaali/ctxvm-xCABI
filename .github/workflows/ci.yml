# ci.yml — ctxvm repository gate (card T10).
#
# NOTE: this repo currently has NO git remote; Actions runs start once the
# orchestrator adds one. tools/run-ci.sh is the byte-equivalent local mirror
# (all four gates witnessed green locally on 2026-10-22 — see RR-T10-20261022).
# Pins mirror the local toolchain: python 3.14 / jsonschema 4.26.0 /
# open-data-products==0.4.0, node 26, rust stable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test
        working-directory: rust
      - name: ctxvm-tokenizer tiktoken feature (real BPE backends, W2)
        run: cargo test -p ctxvm-tokenizer --features tiktoken
        working-directory: rust

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release (UC2 forensics golden parity binaries)
        run: cargo build --release
        working-directory: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: "@ctxvm/node tests (sources, type stripping — no build needed)"
        run: |
          # CI-2 diagnose: a run can fail on a migrated runner image with no
          # assertion in the local mirror — the environment is then part of the
          # record, printed INSIDE the step (exit code stays the tests').
          head -1 /etc/os-release
          node --version
          npm --version
          node --test test/
        working-directory: packages/node
      - name: "@ctxvm/node install + build (W10: the publishable artifact)"
        run: npm ci --no-audit --no-fund
        working-directory: packages/node
      - name: "T21 export round-trip (slice → replay → diff → checksums; run-ci gate 3)"
        run: bash tools/export-roundtrip.sh
      - name: "src-vs-dist parity (a behaviour-changing build fails here)"
        run: bash tools/check-node-build.sh
      - name: "@ctxvm/opencode tests"
        run: node --test test/
        working-directory: packages/opencode
      - name: "@ctxvm/ai-sdk tests (mirror fix: run-ci has run this suite since T15 B3, ci.yml never got the step)"
        run: node --test test/
        working-directory: packages/ai-sdk
      - name: "packages/node/LICENSE must match the root LICENSE (mirror fix: run-ci gate 2 has checked this since the W10 build card)"
        run: cmp -s LICENSE packages/node/LICENSE
      - name: "otel-export drift guard (D3-c promotion: EXPORT_SPEC vs schema + golden bytes + OTLP structure + CLI)"
        run: node --test tools/otel-export.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install pytest (hermes + benchmarks/metrics suites)
        run: pip install pytest
      - name: "@ctxvm/hermes tests (full suite: plugin + uc_registry + uc2_forensics)"
        run: python -m pytest test/ -q
        working-directory: packages/hermes
      - name: "@ctxvm/py binding tests (byte-compare vs rust CLI on m1/m2 anchors)"
        run: python -m pytest test/ -q
        working-directory: packages/py
      - name: plugin.yaml version must match PLUGIN_VERSION
        run: |
          ver=$(sed -n 's/^version: *//p' packages/hermes/live/plugin.yaml)
          grep -q "PLUGIN_VERSION = \"$ver\"" packages/hermes/live/__init__.py
      - name: "benchmarks/metrics suite (07 formulas + UC3 policy sim)"
        run: python -m pytest benchmarks/metrics -q

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install jsonschema (pinned to the local venv)
        run: pip install "jsonschema==4.26.0"
      - name: rfc-0 schema validator (spec vectors + all fixtures + corpus drop)
        run: >
          python spec/rfc-0/validate_schema.py
          benchmarks/metrics/fixtures/session-healthy.jsonl
          benchmarks/metrics/fixtures/session-thrashing.jsonl
          packages/node/fixtures/tracer-healthy.jsonl
          packages/node/fixtures/tracer-recall.jsonl
          packages/opencode/fixtures/opencode-echo.jsonl
          packages/hermes/fixtures/hermes-echo-synthetic.jsonl
          packages/hermes/fixtures/hermes-thrash-synthetic.jsonl
          corpus/m1/session-healthy.jsonl
          corpus/m1/session-thrashing.jsonl
          corpus/m1/tracer-healthy.jsonl
          corpus/m1/tracer-recall.jsonl
          corpus/m1/opencode-echo.jsonl
          corpus/m2/live-echo.jsonl
          corpus/m2/live-thrash.jsonl
          corpus/m3/hermes-echo-synthetic.jsonl
          corpus/m3/hermes-thrash-synthetic.jsonl
          corpus/m4/hermes-live-session-01.jsonl
          corpus/m5/opencode-live-session-01.jsonl
          corpus/m6/opencode-pause-session-a.jsonl
          corpus/m6/opencode-resume-session-b.jsonl
          corpus/m7/hermes-pause-session-a.jsonl
          corpus/m7/hermes-resume-session-b.jsonl
          corpus/m8/live-echo.jsonl
          corpus/m8/live-thrash.jsonl
      - name: rfc-0.1 schema validator (additive)
        run: python spec/rfc-0.1/validate_schema_v0_1.py rust/crates/ctxvm-conformance/vectors/events-v0-1.jsonl packages/hermes/fixtures/hermes-live-echo-synthetic.jsonl packages/ai-sdk/fixtures/echo-thrash.trace.jsonl
      - name: corpus drop checksums (M1 seed)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m1
      - name: corpus drop checksums (M2 live)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m2
      - name: corpus drop checksums (M3 Hermes synthetic)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m3
      - name: corpus drop checksums (M4 Hermes live)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m4
      - name: corpus drop checksums (M5 OpenCode live)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m5
      - name: corpus drop checksums (M6 UC1 pause/resume)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m6
      - name: corpus drop checksums (M7 Hermes pause/resume)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m7
      - name: corpus drop checksums (M8 Vercel AI SDK)
        run: sha256sum -c checksums.sha256
        working-directory: corpus/m8

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install open-data-products SDK (pinned)
        run: pip install "open-data-products==0.4.0"
      - name: root manifest ODPS validation
        run: open-data-products validate 04-odps-dataproduct-corpus.yaml
      - name: hub regen via their SDK
        run: tools/build-hub.sh
      - name: byte-identity vs the committed baseline
        run: git diff --exit-code hub/
