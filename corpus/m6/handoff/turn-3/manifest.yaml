# xCABI handoff snapshot manifest — turn 3 slice (ODPS 4.1 flavored)
# Generated by `ctxvm export` (ctxvm v0); every artifact is checksummed in checksums.sha256.
schema: https://opendataproducts.org/v4.1/schema/odps.yaml
version: "4.1"
kind: xCABI-handoff-snapshot

product:
  metadata:
    id: ctxvm-handoff-turn-3
    name: 'xCABI handoff snapshot at turn 3'
    derivedFrom: '/tmp/opencode/m6-cap/a/m6-a.jsonl'
    agent: 'ctxvm-m6'
    model: 'opencode/glm-5.3-flash-free'
    provider: 'opencode'
    budgetTokens: 200000
    sliceTurn: 3
    sourceEvents: 18
    keptEvents: 18
  x-cabi:
    format: xCABI
    traceFormatVersion: "0.1"
    coverage: 'positional prefix through turn 3 (last event with a turn <= 3; trailing turn-less bookkeeping excluded)'

distribution:
  - path: 'trace-3.jsonl.zst'
    mediaType: 'application/zstd'
    payload: 'xCABI 0.1 JSONL (one RFC-0 event per line)'
    compression: zstd
    bytes: 578
  - path: 'page-table-3.json'
    mediaType: 'application/json'
    bytes: 1283

dataQuality:
  - check: replayDeterminism
    dimension: validity
    passed: true
    detail: '18 slice events replayed; 0 divergences'
  - check: sourceFidelity
    dimension: validity
    passed: true
    detail: 'shared positional prefix 18 of 18 source events; relation Identical'
  - check: pinLint
    dimension: completeness
    passed: true
    detail: '0 pin-lint hits (pin-family violations + pinned-stub slots at turn 3)'
  - check: redactionScan
    dimension: uniqueness
    passed: true
    detail: 'v0 credential-shaped token scan over 2 artifact texts (trace slice + page table): 0 hits'

kpi:
  - id: kpi-fault-recall
    value: 1.0000
    target: 0.95
    formula: 'faults recorded at turn <= N whose page is Full at N / faults recorded <= N; null when no faults'
  - id: kpi-net-token-reduction
    value: 0.0000
    target: 0.40
    formula: 'stubbedTokens / (residentTokens + stubbedTokens) at the slice turn; v0 stub-cost fraction (policy-vs-policy net cost is UC3)'
  - id: kpi-touch-ratio
    value: 1.0000
    target: 0.60
    formula: 'distinct pages with a recorded full render <= N / declared slot roster; null when empty'

verify:
  decompress: 'zstd -d trace-3.jsonl.zst -o trace-3.jsonl'
  replay: 'ctxvm replay trace-3.jsonl --turn 3   # expect exit 0, divergences: []'
  diff: 'ctxvm diff /tmp/opencode/m6-cap/a/m6-a.jsonl trace-3.jsonl   # expect extension relation; shared prefix matches turn 3'
